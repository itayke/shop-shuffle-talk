<title>Shop Shuffle Talk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The game's shop icon, its gold front turned banner green to tell the deck's tab from the game's -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Press+Start+2P&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* The page is chrome around one 16:9 stage: the stage is always the game's daytime street, the chrome follows the theme */
:root {
  --bg: #e7ebf0;
  --panel: #f7f9fb;
  --ink: #17202b;
  --muted: #586374;
  --line: #d0d7e0;
  --accent: #e6a200;
  --accent-ink: #17202b;
  --chute: #2b78c6;
  --danger: #d2462a;
  --frame-bg: #17202b;
  --font-title: 'Jersey 15', 'Arial Black', Impact, sans-serif;
  --font-pixel: 'Press Start 2P', ui-monospace, monospace;
  --font-body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --ink: #e4e9ef; --muted: #93a0b1; --line: #283241;
    --accent: #f2b731; --chute: #5aa6f0; --danger: #f06a4e; --frame-bg: #06090d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --ink: #e4e9ef; --muted: #93a0b1; --line: #283241;
  --accent: #f2b731; --chute: #5aa6f0; --danger: #f06a4e; --frame-bg: #06090d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }

header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
.eyebrow, .keys, .counter { font: 400 10px/1.6 var(--font-pixel); letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin: 0; }
.keys { font-size: 8px; }

/* The stage: a fixed 1920×1080 slide, scaled to fit its frame */
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--frame-bg); border-radius: 4px; overflow: hidden; cursor: pointer; }
.frame:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; background: #000; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #7cc6ea; }
.stage canvas { image-rendering: pixelated; display: block; }
.scene { position: absolute; inset: 0; width: 1920px; height: 1080px; }

/* Controls under the stage */
.bar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--chute); outline-offset: 2px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.spacer { flex: 1; }

/* Notes and the outline */
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; display: grid; gap: 10px; }
.panel h2 { font: 400 30px/1 var(--font-title); margin: 0; }
.notes-text { margin: 0; font-size: 18px; white-space: pre-wrap; }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
.warn { margin: 0; padding-left: 18px; color: var(--danger); font-size: 14px; }
.warn:empty { display: none; }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.outline .sec { display: flex; justify-content: space-between; font: 400 8px/1 var(--font-pixel); text-transform: uppercase; color: var(--muted); padding: 12px 8px 6px; }
.outline .sec:first-child { padding-top: 0; }
.outline button { appearance: none; width: 100%; display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; text-align: left; border: 0; border-radius: 4px; background: transparent; color: var(--ink); font: 400 15px/1.3 var(--font-body); padding: 6px 8px; cursor: pointer; }
.outline button:hover { background: var(--bg); }
.outline button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.outline .n, .outline .t { font-variant-numeric: tabular-nums; opacity: 0.75; font-size: 13px; }
.outline .total { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 8px; padding: 10px 8px 0; font-weight: 600; font-size: 14px; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Shop Shuffle talk · deck</p>

  <div class="frame" id="frame">

    </section>
  </div>
</div>

<script src="shop-sfx.js"></script>
<script src="pixel-title.js"></script>
<script src="slides.js"></script>
<script>
// ---- Constants -------------------------------------------------------------
const STAGE_W = 1920, STAGE_H = 1080;
// The street is drawn at quarter resolution and scaled up, so one art pixel is this many stage pixels
const ART = 4;
const ART_W = STAGE_W / ART, ART_H = STAGE_H / ART;
const snap = (v) => Math.round(v / ART) * ART;

// The street's fixed daylight palette and banner colors (from the game's renderer), plus the shades the deck derives
const C = {
  skyTop: '#7cc6ea', skyLow: '#d9eff7', skyline: '#b2d4e0', skylineWin: '#a5c9d8',
  sidewalk: '#cdbd9f', sidewalkLit: '#dccfb5', seam: '#b8a88a', curb: '#857563',
  asphalt: '#3c414f', grit: '#474c5b', ink: '#1c1a26',
  bannerGold: '#f5c746', bannerGreen: '#52a65e', bannerBlue: '#4a86d8',
  cloud: '#ffffff', cloudShade: '#dcedf5',
};
// A slide's `color` names one of the game's round-banner colors
const TITLE_COLORS = { gold: C.bannerGold, green: C.bannerGreen, blue: C.bannerBlue };
const TEXT_COLOR = '#2b3a55';

// The sidewalk's top edge, in art pixels; media lands on it, and captions sit on the road below
const STREET_TOP = 236;
const SIDEWALK_H = 14, CURB_H = 2, SKY_BANDS = 5;
const STREET_Y = STREET_TOP * ART;
const ROAD_Y = (STREET_TOP + SIDEWALK_H + CURB_H) * ART;

// Each media item's card, like the lobby's QR join card in dark mode: a dark panel, hairline border, rounded card and footage
const CARD = { bg: 'rgba(22,29,39,0.92)', line: '#283241', pad: 16, border: 1, clipRadius: 12 };
const CARD_INSET = CARD.pad + CARD.border;
// The card's corner follows the footage's corner out by the inset, so the two curves run parallel
const CARD_RADIUS = CARD.clipRadius + CARD_INSET;
// Cards for media still to come, or a file that didn't load
const PLACEHOLDER = { bg: '#1c1a26', label: '#f5c746', text: '#d0d7e0', font: 24, pad: 32 };
const CAPTION = { color: '#dccfb5', font: 24 };
// A slide's footer (in the small pixel face, like the captions) and logo, on the road; the logo sits a little above the
// road's middle, where it looks level with the footer
const FOOTER = { font: 24, logoH: 44, logoLift: 2 };

// Layout, in stage pixels: margins, gaps, and the size limits for media
const MARGIN_X = 96, MARGIN_TOP = 64;
const BLOCK_GAP = 56, MEDIA_GAP = 40;
const MEDIA_MAX_H = 784, MEDIA_MIN_H = 280;
// The widest the text column beside media grows, as a share of the width between the margins. A slide's `bulletWidth` names
// a share by word or gives a number, kept within the range; the media takes the rest
const SIDE_WIDTHS = { narrow: 0.28, normal: 0.37, wide: 0.5 }, SIDE_WIDTH_RANGE = [0.15, 0.75];
// Flanking text keeps this far off the card and the stage edge
const FLANK_MARGIN = 48;
// A flank's title and text center this far down the cards; a side column centers on them
const SIDE_RISE = 0.42;
// Text goes beside the media only when that makes the media this much taller than with the text above it
const SIDE_BIAS = 1.25;
const DEFAULT_ASPECT = 16 / 9;

// Type, in screen pixels per font pixel. When a slide's text doesn't fit, the next set is tried
const TYPE_STEPS = [
  { title: 4, hero: 6, cover: 8, text: 3, coverText: 5, bullet: 2 },
  { title: 3, hero: 5, cover: 7, text: 2, coverText: 4, bullet: 2 },
];
// Spacing in font pixels of the element below the gap: title to text, before the bullets, between bullets
// Bullets sit further apart than a wrapped bullet's own lines, so each still reads as one item
const GAP_TEXT = 5, GAP_BULLETS = 10, GAP_BULLET = 8;
// The bullet is a one-color pixel heart in the words' own color. Its pixels are this many bullet units each, and its gap
// to the words is in bullet units
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
const HEART_CELL = 1.5, BULLET_INDENT = 7;
// The heart sits this many art pixels below the words' middle, where it reads as level with them
const HEART_DROP = 1;
// Wrapped tagline lines step this many ems apart; Jersey 15's em is tall, so under 1 still leaves room
const LEADING = 0.8;
const TITLE_FONT = "'Jersey 15', 'Arial Black', Impact, sans-serif";
// Bullets carry more words than the pixel faces read well at, so they use the game's sans, smooth. Its size is in bullet
// units, its line pitch in ems, and a bullet's square centers this far above the baseline, in ems
// Words wrapped in **double asterisks** take the bold weight
const BULLET_FONT = { family: "'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif", weight: 500, bold: 700, em: 18, leading: 1.25, mid: 0.35 };
const FONT_LOADS = ["400 27px 'Jersey 15'", `${BULLET_FONT.weight} 36px 'Work Sans'`, `${BULLET_FONT.bold} 36px 'Work Sans'`];
// How opaque smooth text must be to become a solid pixel (as in pixel-title.js)
const INK_ALPHA = 128;

// Motion, from the game's MOTION_LOOK: drop time, squash amount and time. The squash is softer than the game's, since a
// card is far larger on screen than a shop
const DROP_MS = 600, SQUASH = 0.1, SQUASH_MS = 200;
// The squash builds over this share of its time, then relaxes over the rest, instead of snapping on impact
const SQUASH_IN = 0.1;
// Media starts this many times its on-screen fall above the stage, so it is out of sight while the video loads
const DROP_LEAD = 2;
// Several media items land one after another, this far apart, like shops joining
const STAGGER_MS = 140;
const TEXT_FADE_MS = 250;
// Bullets come in one after another, each fading in as it settles from this many stage pixels higher
const BULLET_IN_MS = 300, BULLET_STAGGER_MS = 120, BULLET_RISE = 10;
// A card's caption comes in as the card lands, fading in as it rises from this many stage pixels lower
const CAPTION_IN_MS = 300, CAPTION_SINK = 10;
const REVEAL_SFX = 'step';
// Stamps (award laurels) slam onto a card's top-right corner once it settles. Each is a
// share of the card's width, capped, with an inset from the media's edges; it starts this many times larger and tilted,
// overshoots below full size at the impact point (a share of its time), then settles
const STAMP_SHARE = 0.15, STAMP_MAX_W = 150, STAMP_INSET = 20, STAMP_GAP = 16;
const STAMP_MS = 260, STAMP_FROM = 2.5, STAMP_TILT = -10, STAMP_HIT = 0.6, STAMP_UNDER = 0.92;
const STAMP_DELAY_MS = 250, STAMP_STAGGER_MS = 200;
const STAMP_SHADOW = 'drop-shadow(0 2px 8px rgba(0,0,0,0.75))';
const STAMP_SFX = 'shutDown';
// How long to wait for a media file's size or the title font before going on without it
const PROBE_TIMEOUT_MS = 4000, FONT_WAIT_MS = 2500;

const VIDEO_RE = /\.(mp4|webm|mov|m4v)$/i;
const SLIDE_KEYS = ['kind', 'footer', 'logo', 'section', 'title', 'text', 'topBullets', 'bullets', 'bulletWidth', 'reveal', 'media', 'notes', 'secs', 'color', 'layout'];
// Old field names, each with its new one
const RENAMED_KEYS = { sideBullets: 'bullets', sideWidth: 'bulletWidth' };
const MEDIA_KEYS = ['src', 'todo', 'aspect', 'caption', 'pixel', 'stamps'];
const DECK_KEYS = ['slides', 'reveal'];
const LAYOUTS = ['stack', 'side', 'flank'];
// How a slide's bullets and media come in: all at once (false), one item per click (serial: media, then top bullets, then
// side bullets), or one of each per click (parallel: the first media, top bullet and side bullet together, and so on).
// The first step shows on arrival. `true` means serial
const REVEALS = ['serial', 'parallel'];
const KINDS = ['title'];

// ---- Elements and state ------------------------------------------------------
const $ = (id) => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), soundBox = $('sound');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let slides = [];
let cur = 0, revealed = 0, parts = null, playGen = 0, ready = false, timers = [];

const sfx = (id) => { if (!soundBox.checked || !window.ShopSfx) return; try { ShopSfx.play(id); } catch (e) {} };
const unlock = () => { try { window.ShopSfx && ShopSfx.unlock(); } catch (e) {} };
addEventListener('pointerdown', unlock, { once: true });
addEventListener('keydown', unlock, { once: true });

// ---- Reading the flow ------------------------------------------------------
// The side column's widest, in stage pixels, from a slide's `bulletWidth`: a word from SIDE_WIDTHS or a share of the width
function bulletWidth(v, warnings) {
  const [lo, hi] = SIDE_WIDTH_RANGE;
  let share = SIDE_WIDTHS.normal;
  if (typeof v === 'number' && Number.isFinite(v)) {
    share = Math.min(hi, Math.max(lo, v));
    if (share !== v) warnings.push(`"bulletWidth" ${v} is outside ${lo}–${hi}, so ${share} is used`);
  } else if (v != null) {
    if (SIDE_WIDTHS[v]) share = SIDE_WIDTHS[v];
    else warnings.push(`Unknown bulletWidth "${v}": use ${Object.keys(SIDE_WIDTHS).join(', ')}, or a number like 0.45`);
  }
  return Math.round(share * (STAGE_W - 2 * MARGIN_X));
}

// Fills in defaults and collects a warning for every field the deck doesn't know, so typos show up
function readDeck() {
  const warnings = [];
  const deck = typeof DECK !== 'undefined' ? DECK : null;
  if (!deck || !Array.isArray(deck.slides)) {
    warnings.push('slides.js did not load or has no slides list. Check the browser console for a syntax error.');
    return { slides: [], warnings };
  }
  for (const k of Object.keys(deck)) if (!DECK_KEYS.includes(k)) warnings.push(`Unknown deck field "${k}"`);
  const revealMode = (v, warn) => {
    if (v === true) return 'serial';
    if (v == null || v === false) return false;
    if (REVEALS.includes(v)) return v;
    warn.push(`Unknown reveal "${v}": use ${REVEALS.join(', ')}, true or false`);
    return false;
  };
  const deckReveal = revealMode(deck.reveal, warnings);
  let section = '';
  const list = deck.slides.map((raw, i) => {
    const s = { ...raw, n: i + 1, warnings: [] };
    for (const k of Object.keys(raw)) {
      if (RENAMED_KEYS[k]) s.warnings.push(`"${k}" is now "${RENAMED_KEYS[k]}"`);
      else if (!SLIDE_KEYS.includes(k) && k !== 'byline') s.warnings.push(`Unknown field "${k}"`);
    }
    if (s.layout && !LAYOUTS.includes(s.layout)) s.warnings.push(`Unknown layout "${s.layout}"`);
    if (s.kind && !KINDS.includes(s.kind)) s.warnings.push(`Unknown kind "${s.kind}": use ${KINDS.join(', ')}, or leave it out`);
    if ('byline' in raw) s.warnings.push('"byline" is now "footer"');
    if (s.color && !TITLE_COLORS[s.color]) s.warnings.push(`Unknown color "${s.color}"`);
    section = s.section || section;
    s.section = section;
    const arr = (v) => (v == null ? [] : [].concat(v));
    s.topBullets = arr(raw.topBullets);
    // `bullets` stand beside the media, so they're the side list here
    s.sideBullets = arr(raw.bullets);
    // Every bullet in reveal order: the top ones, then the side ones
    s.bullets = [...s.topBullets, ...s.sideBullets];
    if (s.layout && s.bullets.length) s.warnings.push('"layout" applies only to slides without bullets');
    s.sideW = bulletWidth(raw.bulletWidth, s.warnings);
    s.media = (s.media == null ? [] : [].concat(s.media)).map((m) => {
      const item = typeof m === 'string' ? { src: m } : { ...m };
      for (const k of Object.keys(item)) if (!MEDIA_KEYS.includes(k)) s.warnings.push(`Unknown media field "${k}"`);
      item.kind = !item.src ? 'todo' : VIDEO_RE.test(item.src) ? 'video' : 'image';
      item.stamps = [].concat(item.stamps ?? []);
      return item;
    });
    s.reveal = 'reveal' in raw ? revealMode(raw.reveal, s.warnings) : deckReveal;
    return s;
  });
  return { slides: list, warnings };
}

// '9:16' or a number; anything else falls through to the file's own shape
function parseAspect(a) {
  if (typeof a === 'number' && a > 0) return a;
  const m = typeof a === 'string' && a.match(/^\s*([\d.]+)\s*[:x/]\s*([\d.]+)\s*$/);
  return m ? Number(m[1]) / Number(m[2]) : null;
}

// Learns each file's shape before its slide is laid out, and marks files that don't load
function probe(item) {
  if (item.kind === 'todo') return Promise.resolve();
  return new Promise((resolve) => {
    let timer = 0;
    const done = (aspect, ok) => { clearTimeout(timer); item.natural = aspect; item.missing = !ok; resolve(); };
    timer = setTimeout(() => done(null, true), PROBE_TIMEOUT_MS);
    if (item.kind === 'video') {
      const v = document.createElement('video');
      v.preload = 'metadata'; v.muted = true;
      v.onloadedmetadata = () => done(v.videoWidth / v.videoHeight, true);
      v.onerror = () => done(null, false);
      v.src = item.src;
    } else {
      const img = new Image();
      img.onload = () => done(img.naturalWidth / img.naturalHeight, true);
      img.onerror = () => done(null, false);
      img.src = item.src;
    }
  });
}
const aspectOf = (item) => parseAspect(item.aspect) || item.natural || DEFAULT_ASPECT;

// ---- Drawing the street ------------------------------------------------------
// A small seeded random, so the skyline and the road's grit are the same on every draw
const rng = (seed) => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const mix = (a, b, t) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',')})`;
};
// Each cloud's starting x, its y and whether it's a big one, in art pixels
const CLOUDS = [[38, 34, 1], [176, 18, 0], [300, 58, 1], [404, 26, 0]];
const CLOUD_W = { big: 34, small: 24 };
// Clouds drift right like the game's, in art pixels per second, each a little faster than the one before
const CLOUD_SPEED = 2, CLOUD_SPEED_STEP = 0.15;
function cloud(ctx, x, y, big) {
  const w = big ? CLOUD_W.big : CLOUD_W.small;
  ctx.fillStyle = C.cloud;
  ctx.fillRect(x, y + 4, w, 5);
  ctx.fillRect(x + 4, y + 1, Math.round(w * 0.45), 4);
  ctx.fillRect(x + Math.round(w * 0.4), y - 1, Math.round(w * 0.35), 6);
  ctx.fillStyle = C.cloudShade;
  ctx.fillRect(x, y + 9, w, 2);
}

// Paints the 1920×1080 street: banded, dithered sky, the hazy skyline, the sidewalk and the road
function drawStreet() {
  const canvas = document.createElement('canvas');
  canvas.width = ART_W; canvas.height = ART_H;
  canvas.className = 'scene';
  const ctx = canvas.getContext('2d');
  const top = STREET_TOP;
  const bandH = Math.ceil(top / SKY_BANDS);
  for (let b = 0; b < SKY_BANDS; b++) {
    ctx.fillStyle = mix(C.skyTop, C.skyLow, b / (SKY_BANDS - 1));
    ctx.fillRect(0, b * bandH, ART_W, bandH);
    if (b === 0) continue;
    // Two rows of checker dither soften each band edge, like the game's sky
    ctx.fillStyle = mix(C.skyTop, C.skyLow, (b - 1) / (SKY_BANDS - 1));
    for (let x = 0; x < ART_W; x += 2) { ctx.fillRect(x, b * bandH, 1, 1); ctx.fillRect(x + 1, b * bandH + 1, 1, 1); }
  }
  const r = rng(7);
  for (let x = -4; x < ART_W;) {
    const w = 18 + Math.floor(r() * 26), h = 26 + Math.floor(r() * 54);
    ctx.fillStyle = C.skyline;
    ctx.fillRect(x, top - h, w - 2, h);
    ctx.fillStyle = C.skylineWin;
    for (let wy = top - h + 4; wy < top - 4; wy += 6) for (let wx = x + 3; wx < x + w - 5; wx += 5) ctx.fillRect(wx, wy, 2, 2);
    x += w + Math.floor(r() * 10);
  }
  ctx.fillStyle = C.ink; ctx.fillRect(0, top - 1, ART_W, 1);
  ctx.fillStyle = C.sidewalk; ctx.fillRect(0, top, ART_W, SIDEWALK_H);
  ctx.fillStyle = C.sidewalkLit; ctx.fillRect(0, top, ART_W, 1);
  ctx.fillStyle = C.seam; for (let x = 7; x < ART_W; x += 14) ctx.fillRect(x, top + 1, 1, SIDEWALK_H - 1);
  ctx.fillStyle = C.curb; ctx.fillRect(0, top + SIDEWALK_H, ART_W, CURB_H);
  const road = top + SIDEWALK_H + CURB_H;
  ctx.fillStyle = C.asphalt; ctx.fillRect(0, road, ART_W, ART_H - road);
  const g = rng(11); ctx.fillStyle = C.grit;
  for (let i = 0; i < 260; i++) ctx.fillRect(Math.floor(g() * ART_W), road + 1 + Math.floor(g() * (ART_H - road - 1)), 1, 1);
  return canvas;
}
const street = drawStreet();

// The clouds' own layer over the street, kept across slides so they drift on through every change. Each cloud is drawn
// once in art pixels, then stamped at whole screen pixels, so it keeps its blocky look but glides; they wrap around the

// ---- Type ----------------------------------------------------------------------
const el = (tag, css, text) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (text != null) e.textContent = text; return e; };

// Balanced word wrap to a width: as few lines as greedy wrapping needs, at the narrowest width that still holds them, so
// the lines come out near equal (4 + 4 words rather than 7 + 1). A newline in the text forces a break
function wrap(ctx, text, maxW) {
  const greedy = (para, w) => {
    const out = [];
    let line = '';
    for (const word of para.split(' ')) {
      const next = line ? `${line} ${word}` : word;
      if (line && ctx.measureText(next).width > w) { out.push(line); line = word; } else line = next;
    }
    out.push(line);
    return out;
  };
  return String(text).split('\n').flatMap((para) => {
    const lines = greedy(para, maxW);
    if (lines.length < 2) return lines;
    let lo = 0, hi = Math.ceil(maxW);
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (greedy(para, mid).length > lines.length) lo = mid; else hi = mid; }
    return greedy(para, hi);
  });
}

// Text in the lobby tagline's style: hard-edged Jersey 15 without an outline, wrapped to a width

  c.setAttribute('role', 'img'); c.setAttribute('aria-label', text);
  const ratio = window.devicePixelRatio || 1;
  const unit = px * ratio;
  const size = Math.round(unit * PixelTitle.GRID);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const font = `400 ${size}px ${TITLE_FONT}`;
  ctx.font = font;
  const lines = wrap(ctx, text, maxW * ratio);
  const m = ctx.measureText('Hg');
  const ascent = Math.ceil(m.fontBoundingBoxAscent ?? size * 0.8), descent = Math.ceil(m.fontBoundingBoxDescent ?? size * 0.2);
  // Line pitch and each line's start stay on whole font pixels, so every line is equally crisp

  const w = Math.max(1, ...widths), h = ascent + descent + pitch * (lines.length - 1);
  c.width = w; c.height = h;
  c.style.width = `${w / ratio}px`; c.style.height = `${h / ratio}px`;

// ---- Layout ------------------------------------------------------------------

  const used = head.h + (head.h && tops.h ? BLOCK_GAP : 0) + tops.h;

  if (p.tops.h) {

// Lays the planned slide onto the street: cards stand on the sidewalk, words float in the sky, captions sit on the road
function build(s, p) {
  stage.replaceChildren(street, sky);
  const cards = [], fades = [];
  let rows = [];
  if (p.mode === 'center') {
    stage.append(place(p.block.el, (STAGE_W - p.block.w) / 2, (STREET_Y - p.block.h) / 2));
    return { cards, fades: [p.block.el], rows: p.block.rows, road: roadLine(s) };
  }
  const { row } = p;
  const rowTop = STREET_Y - row.rowH;
  let x;
  if (p.mode === 'stack') {
    x = (STAGE_W - row.rowW) / 2;

  } else if (p.mode === 'side') {
    const textW = p.block.w ? p.block.w + BLOCK_GAP : 0;
    const x0 = (STAGE_W - textW - row.rowW) / 2;

    let lo = MARGIN_TOP;

    const y = Math.max(lo, Math.min(STREET_Y - p.block.h - MARGIN_TOP, rowTop + (row.rowH - p.block.h) / 2));

function stampRow(card, srcs, mediaW) {
  const n = srcs.length;

  const w = Math.floor(Math.min(STAMP_MAX_W, mediaW * STAMP_SHARE, fit));
  const row = el('div', `position:absolute; left:${CARD.pad + STAMP_INSET}px; right:${CARD.pad + STAMP_INSET}px; top:${CARD.pad + STAMP_INSET}px; display:flex; align-items:flex-start; justify-content:flex-end; gap:${STAMP_GAP}px; pointer-events:none;`);
  const out = srcs.map((src) => {
    const img = el('img', `display:block; width:${w}px; height:auto; filter:${STAMP_SHADOW};`);
    img.src = src; img.alt = '';

}

// ---- Motion ------------------------------------------------------------------
const squashScale = (q) => `scale(${1 + q / 2}, ${1 - q})`;

// An element's entrance: it fades in as it settles from dy stage pixels away (negative is above), after a delay; until it
// starts, it stays hidden at its starting point
function settleIn(node, delay, dy, ms) {
  node.animate(
    [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }],
    { duration: ms, delay, easing: 'ease-out', fill: 'backwards' },
  );
}
const bulletIn = (row, delay) => settleIn(row, delay, -BULLET_RISE, BULLET_IN_MS);
// A stamp slams down from large and tilted, overshooting a little before it settles, with a thud on impact
function stampIn(img, delay) {
  timers.push(setTimeout(() => sfx(STAMP_SFX), delay + STAMP_MS * STAMP_HIT));
  img.animate(
    [
      { opacity: 0, transform: `scale(${STAMP_FROM}) rotate(${STAMP_TILT}deg)`, easing: 'ease-in' },
      { opacity: 1, transform: `scale(${STAMP_UNDER})`, offset: STAMP_HIT, easing: 'ease-out' },
      { opacity: 1, transform: 'none' },
    ],
    { duration: STAMP_MS, delay, fill: 'backwards' },
  );
}

// Plays one step in: its cards fall from well above the stage and squash on landing, one after another, each caption rising
// in as its card lands and its stamps slamming on once all have settled; then the words wash in (only `fades`, on arrival)
// and the step's bullets follow one by one. A step without cards is just its bullets, with a click sound
function play(step, fades) {
  const { cards, rows } = step, n = cards.length;
  const gen = playGen;
  const lastLand = n ? DROP_MS + (n - 1) * STAGGER_MS : 0;
  cards.forEach((c, i) => c.cap && settleIn(c.cap, DROP_MS + i * STAGGER_MS, CAPTION_SINK, CAPTION_IN_MS));
  rows.forEach((r, i) => bulletIn(r, lastLand + i * BULLET_STAGGER_MS));
  cards.flatMap((c) => c.stamps).forEach((img, i) => stampIn(img, lastLand + SQUASH_MS + STAMP_DELAY_MS + i * STAMP_STAGGER_MS));
  if (n) sfx('drop'); else if (rows.length && !fades.length) sfx(REVEAL_SFX);
  if (!n && !fades.length) return;
  const end = lastLand + Math.max(n ? SQUASH_MS : 0, fades.length ? TEXT_FADE_MS : 0);
  const landed = new Set();
  fades.forEach((f) => (f.style.opacity = '0'));
  const start = performance.now();
  const tick = (now) => {
    if (gen !== playGen) return;
    const T = now - start;
    cards.forEach((c, i) => {
      const t = T - i * STAGGER_MS;
      const from = -(c.top + c.h) * DROP_LEAD;
      if (t < DROP_MS) { const u = Math.max(0, t) / DROP_MS; c.el.style.transform = `translateY(${snap(from * (1 - u * u))}px)`; }
      else if (t < DROP_MS + SQUASH_MS) {
        if (!landed.has(i)) { landed.add(i); sfx('land'); }
        const u = (t - DROP_MS) / SQUASH_MS;
        c.el.style.transform = squashScale((u < SQUASH_IN ? u / SQUASH_IN : (1 - u) / (1 - SQUASH_IN)) * SQUASH);
      } else c.el.style.transform = '';
    });
    const fade = String(Math.max(0, Math.min(1, (T - lastLand) / TEXT_FADE_MS)));
    fades.forEach((f) => (f.style.opacity = fade));
    if (T < end) requestAnimationFrame(tick);
    else { cards.forEach((c) => (c.el.style.transform = '')); fades.forEach((f) => (f.style.opacity = '1')); }
  };
  requestAnimationFrame(tick);
}

// ---- Showing and stepping ----------------------------------------------------
// A slide's steps, each a set of cards and bullet rows. Without reveal it is one step holding everything
function stepsOf(s, pt) {
  const topN = s.topBullets.length;
  const tops = pt.rows.slice(0, topN), sides = pt.rows.slice(topN);
  let steps;
  if (s.reveal === 'serial') steps = [...pt.cards.map((c) => ({ cards: [c], rows: [] })), ...[...tops, ...sides].map((r) => ({ cards: [], rows: [r] }))];
  else if (s.reveal === 'parallel') {
    const n = Math.max(pt.cards.length, tops.length, sides.length);
    steps = Array.from({ length: n }, (_, i) => ({ cards: pt.cards.slice(i, i + 1), rows: [tops[i], sides[i]].filter(Boolean) }));
  } else steps = [{ cards: pt.cards, rows: pt.rows }];
  return steps.length ? steps : [{ cards: [], rows: [] }];
}
function applyReveal() {
  parts.steps.forEach((st, i) => {
    const v = i < revealed ? 'visible' : 'hidden';
    st.rows.forEach((r) => (r.style.visibility = v));
    st.cards.forEach((c) => { c.el.style.visibility = v; if (c.cap) c.cap.style.visibility = v; });
  });
}

// Shows slide i with its first `shown` steps (at least the first)
function show(i, { animate = false, shown = 1 } = {}) {
  if (!slides.length) return;
  playGen++;
  timers.forEach(clearTimeout); timers = [];
  const prev = slides[cur];
  cur = Math.max(0, Math.min(slides.length - 1, i));
  parts = build(slides[cur], plan(slides[cur]));
  parts.steps = stepsOf(slides[cur], parts);
  revealed = Math.max(1, Math.min(shown, parts.steps.length));
  applyReveal();
  // A footer or logo the last slide also had stays put rather than fading in again (a replay fades it anyway)
  const kept = (r) => prev && prev !== slides[cur] && prev[r.key] === slides[cur][r.key];
  if (animate && !reduced.matches) play(parts.steps[0], [...parts.fades, ...parts.road.filter((r) => !kept(r)).map((r) => r.el)]);
  // The slide number in the URL, so a reload comes back to it; some embeds refuse this
  try { history.replaceState(null, '', `#${cur + 1}`); } catch (e) {}
  updateChrome();
}

function next() {
  if (!ready) return;
  if (revealed < parts.steps.length) {
    const step = parts.steps[revealed++];
    applyReveal(); updateChrome();
    if (!reduced.matches) play(step, []); else if (step.rows.length) sfx(REVEAL_SFX);
    return;
  }
  if (cur < slides.length - 1) show(cur + 1, { animate: true });
}
function back() {
  if (ready && cur > 0) show(cur - 1, { shown: Infinity });
}

// ---- Chrome: counter, notes, flow ----------------------------------------------
const clock = (secs) => `${Math.floor(secs / 60)}:${String(Math.round(secs % 60)).padStart(2, '0')}`;
const label = (s) => s.title || s.text || '(untitled)';
let deckWarnings = [];

function buildOutline() {
  const ol = $('outline');
  ol.replaceChildren();
  let section = null, total = 0;
  const sums = {};
  slides.forEach((s) => (sums[s.section] = (sums[s.section] || 0) + (s.secs || 0)));
  slides.forEach((s, i) => {
    if (s.section !== section) {
      section = s.section;
      const head = el('li', ''); head.className = 'sec';
      head.append(el('span', '', section || 'Slides'), el('span', '', sums[section] ? clock(sums[section]) : ''));
      ol.append(head);
    }
    total += s.secs || 0;
    const media = s.media.length ? ` · ${s.media.length} media` : '';
    const btn = el('button', '');
    btn.type = 'button';
    btn.append(el('span', '', String(i + 1)), el('span', '', `${label(s)}${media}`), el('span', '', s.secs ? clock(s.secs) : ''));
    btn.children[0].className = 'n'; btn.children[2].className = 't';
    btn.addEventListener('click', () => show(i, { animate: true }));
    const li = el('li', ''); li.append(btn); ol.append(li);
  });
  const foot = el('li', ''); foot.className = 'total';
  foot.append(el('span', '', 'Talk'), el('span', '', clock(total)));
  ol.append(foot);
}

function updateChrome() {
  const s = slides[cur];
  const steps = s.reveal ? parts.steps.length : 0;
  $('counter').textContent = `${cur + 1} / ${slides.length}${steps > 1 ? ` · step ${revealed} / ${steps}` : ''}`;
  $('notes-title').textContent = `${cur + 1}. ${label(s)}`;
  $('notes').textContent = s.notes || '';
  const nx = slides[cur + 1];
  $('up-next').textContent = nx ? `Next: ${label(nx)}` : 'Last slide: switch to the game tab.';
  const warn = [...deckWarnings, ...s.warnings, ...s.media.filter((m) => m.missing).map((m) => `Missing file: ${m.src}`)];
  $('warn').replaceChildren(...warn.map((w) => el('li', '', w)));
  document.querySelectorAll('#outline button').forEach((b, i) => b.setAttribute('aria-current', String(i === cur)));
}

// ---- Fit and controls --------------------------------------------------------
function fit() {
  const r = frame.getBoundingClientRect();
  const s = Math.min(r.width / STAGE_W, r.height / STAGE_H);
  stage.style.transform = `translate(${(r.width - STAGE_W * s) / 2}px, ${(r.height - STAGE_H * s) / 2}px) scale(${s})`;
  sizeSky(s);
}
new ResizeObserver(fit).observe(frame);

const toggleFull = () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else frame.requestFullscreen?.().catch(() => {});
};
$('prev').addEventListener('click', back);
$('next').addEventListener('click', next);
$('full').addEventListener('click', toggleFull);
frame.addEventListener('click', next);

addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, button') && (e.key === ' ' || e.key === 'Enter')) return;
  // Clickers send B and . to black the screen; the deck ignores both
  if (e.key === 'b' || e.key === 'B' || e.key === '.') { e.preventDefault(); return; }
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); back(); }
  else if (k === 'Home') show(0, { animate: true });
  else if (k === 'End') show(slides.length - 1, { shown: Infinity });
  else if (k === 'r' || k === 'R') show(cur, { animate: true });
  else if (k === 'f' || k === 'F') toggleFull();
});

// ---- Start -----------------------------------------------------------------------
// Waits for the title font and every file's shape (each with a time limit), then opens on the slide in the URL
const read = readDeck();
slides = read.slides;
deckWarnings = read.warnings;
stage.replaceChildren(street, sky);
fit();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
Promise.all([
  Promise.race([Promise.all(FONT_LOADS.map((f) => document.fonts.load(f))), wait(FONT_WAIT_MS)]),
  ...slides.flatMap((s) => s.media.map(probe)),
]).then(() => {
  ready = true;
  buildOutline();
  const fromHash = parseInt(location.hash.slice(1), 10);
  if (slides.length) show(Number.isFinite(fromHash) ? fromHash - 1 : 0, { shown: Number.isFinite(fromHash) ? Infinity : 0 });
  else updateWarningsOnly();
  // Text is measured from the font, so lay out again if it arrives after the wait
  Promise.all(FONT_LOADS.map((f) => document.fonts.load(f))).then(() => slides.length && show(cur, { shown: revealed }));
});
function updateWarningsOnly() { $('warn').replaceChildren(...deckWarnings.map((w) => el('li', '', w))); }
</script>
